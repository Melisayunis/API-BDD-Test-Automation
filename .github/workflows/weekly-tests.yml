name: API BDD Tests

on:

  push:
    branches:
      - main

  schedule:
    - cron: '0 12 * * 0'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Select the test suite to execute'
        required: true
        type: choice
        options:
          - authentication
          - booking
          - booking and data-validation
          - booking and negative
          - known-defect
          - all except known-defect

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run API BDD tests
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            mvn test "-Dcucumber.filter.tags=not @known-defect"
            exit $?
          fi

          case "${{ inputs.tag }}" in
            authentication)
              mvn test "-Dcucumber.filter.tags=@authentication"
              ;;

            booking)
              mvn test "-Dcucumber.filter.tags=@booking"
              ;;

            "booking and data-validation")
              mvn test "-Dcucumber.filter.tags=@booking and @data-validation"
              ;;

            "booking and negative")
              mvn test "-Dcucumber.filter.tags=@booking and @negative"
              ;;

            known-defect)
              mvn test "-Dcucumber.filter.tags=@known-defect"
              ;;

            "all except known-defect")
              mvn test "-Dcucumber.filter.tags=not @known-defect"
              ;;
          esac