name: Weekly API BDD Tests

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run API BDD tests
        run: mvn test "-Dcucumber.filter.tags=not @known-defect"